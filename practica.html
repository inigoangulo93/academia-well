<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu camino · Well Online (prototipo)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Prototipo de Well Online: panel del alumno con su nivel, su racha y el camino de ejercicios que se va abriendo segun avanza.">
<meta name="theme-color" content="#21409A">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#21409A; --tinta:#232B42; --carmin:#C0293B;
    --carmin-suave:#FBE9EB; --azul-suave:#E9EDF9; --neutro:#F2F1ED;
    --crema:#FDFCF9; --verde:#1E8E5A; --verde-suave:#EAF6F0; --gris:#5E6575;
    --linea:rgba(35,43,66,.12); --sombra:0 16px 44px rgba(35,43,66,.12); --radio:20px;
    --dur:.28s; --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--crema);color:var(--tinta);font-family:'Figtree',sans-serif;font-size:17px;line-height:1.6;min-height:100dvh;display:flex;flex-direction:column}
  h1,h2,h3{font-family:'Bree Serif',serif;font-weight:400;color:var(--azul);line-height:1.15}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--azul);outline-offset:3px;border-radius:4px}
  .btn{font-weight:600;font-size:16px;padding:14px 26px;border-radius:100px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;font-family:'Figtree',sans-serif;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s;min-height:48px}
  .btn:active{transform:scale(.98)}
  .btn-azul{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(33,64,154,.24)}
  .btn-azul:hover{box-shadow:0 10px 22px rgba(33,64,154,.3);transform:translateY(-1px)}
  .btn-ghost{color:var(--azul);border:1.5px solid var(--azul);background:transparent}
  .btn-ghost:hover{background:var(--azul-suave)}

  /* ---------- cabecera: la misma que la web ---------- */
  header.main{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
              -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);transition:box-shadow .25s ease}
  header.main.scrolled{box-shadow:0 6px 24px rgba(35,43,66,.09)}
  .nav-inner{display:flex;align-items:center;gap:14px;padding:13px 32px;max-width:1320px;margin:0 auto;
             transition:padding .25s ease}
  header.main.scrolled .nav-inner{padding:8px 32px}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--azul);flex:none}
  .logo svg.mark{height:46px;width:auto;transition:height .25s ease,transform .25s ease}
  header.main.scrolled .logo svg.mark{height:38px}
  .logo:hover svg.mark{transform:rotate(-3deg) scale(1.05)}
  .logo-text{font-family:'Bree Serif',serif;font-size:19px;line-height:1.05;color:var(--azul)}
  .producto{font-family:'Bree Serif',serif;color:var(--azul);font-size:17px;flex:none;padding-left:16px;
            border-left:1px solid var(--linea);line-height:1.2;align-self:center}
  .t-titulo{font-family:'Bree Serif',serif;color:var(--gris);font-size:16px;flex:1;text-align:center;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  body:not(.dentro) .t-titulo{display:none}
  body.dentro .producto{display:none}
  .usuario{margin-left:auto}
  .volver{background:none;border:1.5px solid var(--linea);border-radius:100px;padding:8px 15px 8px 12px;
          font-size:14.5px;font-weight:600;color:var(--gris);cursor:pointer;min-height:40px;flex:none;
          display:inline-flex;align-items:center;gap:5px;max-width:200px;transition:border-color .15s,color .15s}
  .volver:hover{border-color:var(--azul);color:var(--azul)}
  .volver span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .volver svg{flex:none}
  body:not(.dentro) .volver{display:none}

  /* usuario */
  .usuario{position:relative;flex:none;margin-left:auto}
  .usuario-btn{display:flex;align-items:center;gap:9px;background:none;border:1.5px solid var(--linea);
               border-radius:100px;padding:5px 14px 5px 5px;cursor:pointer;min-height:44px;
               transition:border-color .15s,background .15s}
  .usuario-btn:hover,.usuario[data-abierto="1"] .usuario-btn{border-color:var(--azul);background:var(--azul-suave)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;flex:none;
          font-family:'Bree Serif',serif;font-size:16px;display:flex;align-items:center;justify-content:center}
  .usuario-nombre{font-size:15px;font-weight:600;color:var(--tinta);max-width:130px;overflow:hidden;
                  text-overflow:ellipsis;white-space:nowrap}
  .caret{width:7px;height:7px;border-right:2px solid var(--gris);border-bottom:2px solid var(--gris);
         transform:rotate(45deg) translateY(-2px);transition:transform .2s var(--ease);flex:none}
  .usuario[data-abierto="1"] .caret{transform:rotate(225deg) translateY(1px)}
  .usuario-menu{position:absolute;right:0;top:calc(100% + 9px);background:#fff;border:1px solid var(--linea);
                border-radius:16px;box-shadow:0 18px 44px rgba(35,43,66,.16);min-width:238px;padding:8px;
                display:flex;flex-direction:column;gap:1px;z-index:110}
  .um-cab{padding:9px 12px 11px;border-bottom:1px solid var(--linea);margin-bottom:6px}
  .um-cab b{display:block;font-family:'Bree Serif',serif;color:var(--azul);font-size:18px;font-weight:400}
  .um-cab span{display:block;font-size:13.5px;color:var(--gris);margin-top:1px}
  .usuario-menu button,.usuario-menu a{display:flex;align-items:center;justify-content:space-between;gap:10px;
                                       background:none;border:none;text-align:left;padding:10px 12px;border-radius:10px;
                                       font-size:15px;font-weight:600;color:var(--tinta);cursor:pointer;
                                       text-decoration:none;transition:background .13s}
  .usuario-menu button:hover:not(:disabled),.usuario-menu a:hover{background:var(--azul-suave);color:var(--azul)}
  .usuario-menu button:disabled{color:var(--gris);cursor:default}
  .usuario-menu em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
                   color:var(--gris);background:var(--neutro);border-radius:100px;padding:3px 8px}
  .um-sep{height:1px;background:var(--linea);margin:6px 0}

  @media(max-width:820px){
    .nav-inner{padding:10px 18px;gap:10px}
    header.main.scrolled .nav-inner{padding:8px 18px}
    .logo-text{display:none}
    .logo svg.mark{height:38px}
    .producto{display:none}
    .usuario-nombre{display:none}
    .usuario-btn{padding:5px}
    .t-titulo{font-size:16px}
  }
  @media(max-width:520px){.volver span{max-width:88px}}

  /* ---------- pantallas ---------- */
  main{flex:1}
  .pantalla{max-width:760px;margin:0 auto;padding:26px 18px 110px;display:none}
  .pantalla.activa{display:block;animation:entra var(--dur) var(--ease)}
  @keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .kicker{display:inline-block;color:var(--carmin);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .miga{color:var(--gris);font-size:14px;margin-bottom:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .miga span{opacity:.5}
  .miga-atras{background:none;border:none;padding:0;color:var(--azul);font-size:14px;font-weight:600;
              cursor:pointer;text-decoration:underline;text-underline-offset:3px;
              text-decoration-color:rgba(33,64,154,.35);transition:text-decoration-color .15s}
  .miga-atras:hover{text-decoration-color:var(--azul)}

  /* ---------- panel ---------- */
  .hola{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
  .hola h1{font-size:clamp(28px,4.6vw,42px);margin-bottom:4px}
  .situacion{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--gris);font-size:17.5px}
  #nivel-alumno{flex:none;background:var(--azul);color:#fff;font-family:'Bree Serif',serif;font-size:15px;
                border-radius:100px;padding:3px 14px;line-height:1.4}
  .nombre-fila{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 22px}
  .nombre-fila input{font:inherit;font-size:16px;border:1.5px solid var(--linea);border-radius:100px;
                     padding:12px 20px;background:#fff;color:var(--tinta);min-width:0;flex:1;max-width:280px}
  .nombre-fila input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(33,64,154,.14)}
  #sin-test{background:var(--azul-suave);border-radius:14px;padding:13px 18px;font-size:15px;margin-bottom:22px;
            display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  #sin-test a{color:var(--azul);font-weight:700}

  /* continuar: la accion principal, arriba del todo */
  .continuar{background:var(--azul);color:#fff;border-radius:var(--radio);padding:24px 26px;margin-bottom:32px;
             display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;
             box-shadow:0 16px 38px rgba(33,64,154,.26)}
  .cont-eti{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
  .cont-tit{font-family:'Bree Serif',serif;font-size:25px;line-height:1.2;margin:3px 0}
  .cont-sub{font-size:14.5px;opacity:.8}
  .continuar .btn-azul{background:#fff;color:var(--azul);box-shadow:none}
  .continuar .btn-azul:hover{background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}

  /* tarjetas de la columna derecha */
  .tarjeta-p{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:20px;margin-bottom:14px}
  .progreso{text-align:center}
  .aro-caja{position:relative;width:136px;height:136px;margin:2px auto 10px}
  .aro-caja svg{width:100%;height:100%;transform:rotate(-90deg)}
  .aro-caja circle{fill:none;stroke-width:10;stroke-linecap:round}
  .aro-pista{stroke:var(--azul-suave)}
  .aro-avance{stroke:var(--azul);transition:stroke-dashoffset 1.1s var(--ease)}
  .aro-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .aro-centro b{font-family:'Bree Serif',serif;font-size:33px;color:var(--azul);line-height:1;font-variant-numeric:tabular-nums}
  .aro-centro span{font-size:12px;font-weight:600;color:var(--gris);margin-top:2px}
  #aro-detalle{font-size:13.5px;color:var(--gris)}
  .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px;padding-top:16px;border-top:1px solid var(--linea)}
  .cifra b{display:block;font-family:'Bree Serif',serif;font-size:23px;color:var(--azul);line-height:1.05;font-variant-numeric:tabular-nums}
  .cifra span{display:block;font-size:12px;font-weight:600;color:var(--gris);margin-top:2px}

  .racha{text-align:center}
  .racha-num{display:flex;align-items:baseline;justify-content:center;gap:7px;margin-bottom:14px}
  .racha-num b{font-family:'Bree Serif',serif;font-size:38px;color:var(--carmin);line-height:1;font-variant-numeric:tabular-nums}
  .racha-num span{font-size:13.5px;font-weight:600;color:var(--gris)}
  #tira{display:flex;gap:5px;justify-content:center}
  .dia{flex:1;max-width:38px;height:36px;border-radius:10px;background:var(--neutro);display:flex;align-items:center;
       justify-content:center;font-size:12px;font-weight:700;color:var(--gris)}
  .dia i{font-style:normal}
  .dia.hecho{background:var(--carmin);color:#fff}
  .dia.hoy{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--azul)}

  /* insignias: presencia justa, el detalle en su propia hoja */
  .im-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:13px}
  .im-cab h2{font-size:19px}
  #ins-cuenta{font-size:13.5px;font-weight:700;color:var(--gris);font-variant-numeric:tabular-nums}
  #ins-tira{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
  .ins-ficha{width:38px;height:38px;border-radius:50%;background:var(--neutro);display:flex;align-items:center;
             justify-content:center;font-size:19px;line-height:1}
  .ins-ficha.lograda{background:var(--verde-suave);box-shadow:inset 0 0 0 1.5px rgba(30,142,90,.35)}
  .ins-ficha.pendiente{opacity:.32;filter:grayscale(1)}
  .ins-ficha.mas{font-size:13px;font-weight:700;color:var(--gris);font-family:'Figtree',sans-serif}
  #hito{border-top:1px solid var(--linea);padding-top:14px;margin-bottom:14px}
  .hito-eti{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--carmin)}
  .hito-fila{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:2px}
  .hito-tit{font-family:'Bree Serif',serif;color:var(--azul);font-size:17px;line-height:1.2}
  .hito-num{font-size:14px;font-weight:700;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap}
  .hito-barra{display:block;height:6px;background:var(--neutro);border-radius:100px;margin-top:8px;overflow:hidden}
  .hito-barra i{display:block;height:100%;background:var(--carmin);border-radius:100px;transition:width .7s var(--ease)}
  .ver-todas{width:100%;background:none;border:1.5px solid var(--linea);border-radius:100px;padding:10px;
             font-size:14.5px;font-weight:600;color:var(--azul);cursor:pointer;transition:border-color .15s}
  .ver-todas:hover{border-color:var(--azul)}

  /* rutas */
  .ruta{margin-bottom:38px;max-width:640px}
  .ruta-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
  .ruta-cab h2{font-size:25px}
  .ruta-sub{color:var(--gris);font-size:15px;margin-top:2px}
  .nivel-chip{flex:none;background:var(--azul-suave);color:var(--azul);font-size:13px;font-weight:700;
              border-radius:100px;padding:5px 13px;letter-spacing:.03em}
  /* tramos: el camino se recorre por bloques, con su meta al final */
  .tramo{border:1px solid var(--linea);border-radius:18px;background:#fff;margin-bottom:10px;overflow:hidden;
         transition:border-color .18s,box-shadow .18s}
  .tramo.aqui{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-suave)}
  .tramo.hecho{border-color:rgba(30,142,90,.4)}
  .tramo:not(.abierto){background:transparent;border-style:dashed}
  .tramo-cab{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;
             background:none;border:none;padding:15px 18px;cursor:pointer;text-align:left;
             font-family:'Figtree',sans-serif;transition:background .13s}
  .tramo-cab:hover{background:rgba(33,64,154,.045)}
  .chevron{width:8px;height:8px;border-right:2.4px solid var(--gris);border-bottom:2.4px solid var(--gris);
           transform:rotate(-45deg);transition:transform .22s var(--ease);flex:none;margin-left:2px}
  .tramo.abierto .chevron{transform:rotate(45deg)}
  .tramo-tit{font-family:'Bree Serif',serif;color:var(--azul);font-size:19px;line-height:1.2}
  .tramo.hecho .tramo-tit{color:var(--verde)}
  .tramo-cuenta{font-size:13.5px;color:var(--gris);white-space:nowrap}
  .tramo-marca{font-size:13px;font-weight:700;border-radius:100px;padding:5px 12px;white-space:nowrap;
               font-variant-numeric:tabular-nums}
  .tramo-marca.viva{color:var(--azul);background:var(--azul-suave)}
  .tramo-marca.hecho{color:var(--verde);background:var(--verde-suave);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
  .tramo-marca.pronto{color:var(--gris);background:var(--neutro);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
  .tramo-cuerpo{padding:2px 16px 14px}

  /* el camino como mapa: un rail con nodos, no una lista de fichas */
  .mapa{list-style:none;position:relative;margin:0}
  .paso{position:relative}
  .paso.oculta{display:none}
  .paso::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--linea);border-radius:2px}
  .paso:first-child::before{top:30px}
  .paso:last-child::before{bottom:auto;height:30px}
  .paso.completa::before,.paso.abierta::before{background:linear-gradient(var(--azul),var(--azul))}
  .paso.completa::before{background:rgba(30,142,90,.55)}
  .paso.pronto::before{background:repeating-linear-gradient(var(--linea) 0 5px,transparent 5px 10px)}

  .paso-btn{position:relative;width:100%;text-align:left;font-family:'Figtree',sans-serif;color:inherit;
            background:none;border:none;border-radius:16px;padding:10px 14px 12px 0;cursor:pointer;
            display:grid;grid-template-columns:48px 1fr auto;gap:0 14px;align-items:start;
            transition:background .15s}
  .paso-btn:not(:disabled):hover{background:rgba(33,64,154,.05)}
  .paso.aqui .paso-btn{background:var(--azul-suave)}
  .paso.aqui .paso-btn:hover{background:#DFE6F7}
  .paso-btn:disabled{cursor:default}

  .nodo{width:46px;height:46px;margin-left:0;border-radius:50%;background:#fff;border:2px solid var(--linea);
        color:var(--gris);font-family:'Bree Serif',serif;font-size:18px;display:flex;align-items:center;
        justify-content:center;flex:none;position:relative;z-index:1;font-variant-numeric:tabular-nums;
        transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .paso.abierta .nodo{border-color:var(--azul);color:var(--azul)}
  .paso.completa .nodo{background:var(--verde);border-color:var(--verde);color:#fff;font-size:21px}
  .paso.aqui .nodo{background:var(--azul);border-color:var(--azul);color:#fff;
                   box-shadow:0 0 0 5px rgba(33,64,154,.14),0 8px 18px rgba(33,64,154,.28)}
  .paso.pronto .nodo{border-style:dashed;background:var(--crema)}
  .paso.bloqueada .nodo{background:var(--neutro)}
  .paso-btn:not(:disabled):hover .nodo{transform:scale(1.06)}

  .paso-cuerpo{min-width:0;padding-top:6px}
  .paso-tit{display:block;font-family:'Bree Serif',serif;color:var(--azul);font-size:19px;line-height:1.25}
  .paso-sub{display:block;color:var(--gris);font-size:13.5px;line-height:1.45;margin-top:3px;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .paso-barra{display:block;height:6px;background:var(--neutro);border-radius:100px;margin-top:10px;
              max-width:300px;overflow:hidden}
  .paso-barra i{display:block;height:100%;background:var(--azul);border-radius:100px;transition:width .55s var(--ease)}
  .paso.bloqueada .paso-tit,.paso.pronto .paso-tit{color:var(--gris)}
  .paso.bloqueada .paso-sub{color:var(--carmin);white-space:normal}
  /* los pasos lejanos se comprimen: el camino se ve entero sin que 24 filas
     iguales tapen lo que toca ahora */
  .paso.pronto{opacity:.72}
  .paso.pronto .paso-btn{padding-top:5px;padding-bottom:6px}
  .paso.pronto .nodo{width:36px;height:36px;font-size:15px;margin-left:5px}
  .paso.pronto .paso-cuerpo{padding-top:8px}
  .paso.pronto .paso-tit{font-size:17px}
  .paso.bloqueada .paso-btn{padding-bottom:10px}
  .et-aqui{display:inline-block;font-style:normal;background:var(--azul);color:#fff;font-family:'Figtree',sans-serif;
           font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:100px;
           padding:3px 9px;margin-left:9px;vertical-align:middle}

  .paso-marca{align-self:center;flex:none;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;
              border-radius:100px;padding:5px 13px;white-space:nowrap}
  .paso-marca.viva{color:var(--azul);background:var(--azul-suave)}
  .paso-marca.hecho{color:var(--verde);background:var(--verde-suave);font-size:12.5px;letter-spacing:.03em;
                    text-transform:uppercase}
  .paso-marca.pronto{color:var(--gris);background:var(--neutro);font-size:12.5px;letter-spacing:.04em;
                     text-transform:uppercase}
  .paso-marca.gris{color:var(--gris);background:var(--neutro)}

  /* la meta cierra el tramo: el rail muere en ella */
  .paso.meta{padding-top:2px}
  .paso.meta::before{background:repeating-linear-gradient(var(--linea) 0 5px,transparent 5px 10px)}
  .paso.meta .paso-btn,.paso.meta{cursor:default}
  .paso.meta > .nodo{margin:0}
  .paso.meta{display:grid;grid-template-columns:48px 1fr auto;gap:0 14px;align-items:center;
             padding:8px 14px 4px 0}
  .meta-nodo{background:var(--crema);border-style:dashed;font-size:20px}
  .paso.meta .paso-tit{color:var(--gris);font-size:18px}
  .paso.meta.hecho .paso-tit{color:var(--verde)}
  .paso.meta.hecho .meta-nodo{background:var(--verde-suave);border-color:var(--verde);border-style:solid}
  .paso.meta.hecho::before{background:rgba(30,142,90,.55)}

  .ver-mas{margin-top:14px;background:none;border:1.5px solid var(--linea);border-radius:100px;padding:9px 18px;
           font-size:14.5px;font-weight:600;color:var(--azul);cursor:pointer;transition:border-color .15s}
  .ver-mas:hover{border-color:var(--azul)}
  .ruta-pie{color:var(--gris);font-size:13.5px;margin-top:14px;padding-left:4px}

  /* hoja de insignias */
  .hoja{position:fixed;inset:0;z-index:95;background:rgba(35,43,66,.5);backdrop-filter:blur(3px);
        display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .24s var(--ease)}
  .hoja.visible{opacity:1}
  .hoja-caja{background:var(--crema);border-radius:24px;padding:24px;width:100%;max-width:660px;max-height:86vh;
             overflow:auto;box-shadow:0 30px 70px rgba(35,43,66,.36);transform:translateY(14px);
             transition:transform .3s var(--ease)}
  .hoja.visible .hoja-caja{transform:none}
  .hoja-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .hoja-cab h2{font-size:26px}
  .hoja-x{background:none;border:1.5px solid var(--linea);border-radius:50%;width:38px;height:38px;flex:none;
          display:flex;align-items:center;justify-content:center;color:var(--gris);cursor:pointer;transition:border-color .15s,color .15s}
  .hoja-x:hover{border-color:var(--carmin);color:var(--carmin)}
  #insignias{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;grid-auto-rows:1fr}
  .insignia{position:relative;background:transparent;border:1px dashed var(--linea);border-radius:16px;
            padding:16px 13px 14px;text-align:center}
  .ins-icono{display:block;font-size:30px;line-height:1.2;filter:grayscale(1);opacity:.3}
  .ins-tit{display:block;font-weight:700;font-size:14.5px;margin-top:5px;color:var(--gris)}
  .ins-sub{display:block;color:var(--gris);font-size:12.5px;line-height:1.4;margin-top:2px}
  .ins-barra{display:block;height:5px;background:var(--neutro);border-radius:100px;margin-top:10px;overflow:hidden}
  .ins-barra i{display:block;height:100%;background:var(--azul);border-radius:100px}
  .ins-num{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-top:4px;font-variant-numeric:tabular-nums}
  .insignia.lograda{background:#fff;border-style:solid;border-color:rgba(30,142,90,.35);box-shadow:0 6px 16px rgba(35,43,66,.07)}
  .insignia.lograda .ins-icono{filter:none;opacity:1}
  .insignia.lograda .ins-tit{color:var(--tinta)}
  .ins-check{position:absolute;top:9px;right:9px;width:21px;height:21px;border-radius:50%;background:var(--verde);
             color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* ---------- etapa ---------- */
  .et-cab h1{font-size:clamp(25px,4.6vw,33px);margin-bottom:10px}
  #et-temas{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  #et-temas span{background:var(--neutro);border-radius:100px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--gris)}
  .et-progreso{margin-bottom:22px}
  .et-progreso p{font-size:14px;color:var(--gris);margin-bottom:6px}
  .barra{height:8px;background:var(--azul-suave);border-radius:100px;overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--azul),#3A5BC7);border-radius:100px;transition:width .55s var(--ease)}
  .tarjetas{list-style:none;display:grid;gap:10px}
  .tarjeta{width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:15px 17px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;transition:border-color .15s,box-shadow .15s,transform .15s}
  .tarjeta:hover{border-color:var(--azul);box-shadow:0 8px 20px rgba(35,43,66,.09);transform:translateY(-1px)}
  .t-tipo{grid-column:1;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gris)}
  .t-tit{grid-column:1;font-family:'Bree Serif',serif;color:var(--azul);font-size:19px}
  .pill{grid-column:2;grid-row:1/3;font-size:14px;font-weight:700;color:var(--azul);background:var(--azul-suave);border-radius:100px;padding:6px 13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pill.vacia{color:var(--gris);background:var(--neutro);font-weight:600}
  .pill.ok{color:var(--verde);background:var(--verde-suave)}
  .tarjeta.perfecto{border-color:rgba(30,142,90,.4)}

  /* ---------- ejercicio ---------- */
  .ej-cab h1{font-size:clamp(25px,4.6vw,33px);margin-bottom:8px}
  .ej-cab .instruccion{color:var(--gris);margin-bottom:20px}
  .ej-cab .instruccion b{color:var(--tinta);font-weight:600}
  #ej-caja{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border:1px dashed var(--linea);border-radius:14px;padding:14px;margin-bottom:22px}
  #ej-caja span{background:var(--neutro);border-radius:100px;padding:5px 13px;font-size:15px;font-weight:600}

  .frases{list-style:none;counter-reset:f;display:grid;gap:14px}
  .frases>li{counter-increment:f;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 16px 14px 46px;position:relative}
  .frases>li::before{content:counter(f);position:absolute;left:14px;top:14px;font-weight:700;font-size:14px;color:var(--gris);font-variant-numeric:tabular-nums}
  .frase{line-height:2.1}
  .origen{color:var(--tinta);margin-bottom:6px}
  .clave{margin-bottom:6px}
  .clave span{display:inline-block;background:var(--azul-suave);color:var(--azul);border-radius:7px;padding:2px 11px;font-size:13.5px;font-weight:700;letter-spacing:.06em}
  .raiz{display:inline-block;background:var(--neutro);border-radius:7px;padding:2px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--gris)}
  .texto{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:18px 20px}
  .texto p{line-height:2.35;margin-bottom:14px}
  .texto p:last-child{margin-bottom:0}
  .conhueco{white-space:nowrap}
  .num{position:relative;top:-.55em;font-size:11.5px;font-weight:700;color:var(--carmin);font-style:normal;margin-right:1px}

  /* el hueco fija su propia altura de linea: si hereda la del parrafo (2.1 o
     2.35) la caja crece hasta ocupar toda la linea y las de dos lineas
     seguidas se pisan */
  .hueco{font:inherit;line-height:1.35;font-weight:600;color:var(--azul);background:var(--neutro);
         border:1px solid var(--linea);border-bottom:2px solid var(--azul);border-radius:7px 7px 3px 3px;
         padding:2px 8px;max-width:100%;vertical-align:baseline;transition:background .15s,border-color .15s}
  .hueco.corto{width:6.5em}
  .hueco.medio{width:9.5em}
  .hueco.largo{width:14em}
  .hueco:focus{outline:none;background:#fff;border-color:var(--azul);box-shadow:0 0 0 3px rgba(33,64,154,.15)}
  .hueco.ok{color:var(--verde);border-bottom-color:var(--verde);background:var(--verde-suave)}
  .hueco.mal{color:var(--carmin);border-bottom-color:var(--carmin);background:var(--carmin-suave);text-decoration:line-through;text-decoration-thickness:1px}
  .sol{display:inline-block;margin-left:6px;font-size:15px;font-weight:600;color:var(--verde);white-space:normal}
  .sol em{font-style:normal;font-weight:500;color:var(--gris);font-size:13.5px}

  .resultado{margin:24px 0 0;border-radius:14px;padding:16px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;animation:entra var(--dur) var(--ease)}
  .resultado b{font-family:'Bree Serif',serif;font-size:27px;font-variant-numeric:tabular-nums}
  .resultado.genial{background:var(--verde-suave)}.resultado.genial b{color:var(--verde)}
  .resultado.bien{background:var(--azul-suave)}.resultado.bien b{color:var(--azul)}
  .resultado.flojo{background:var(--carmin-suave)}.resultado.flojo b{color:var(--carmin)}

  /* en escritorio los botones ocupan lo que miden, no toda la fila; el
     principal queda a la derecha, que es donde se busca para avanzar */
  #ej-pie{position:sticky;bottom:0;background:linear-gradient(to top,var(--crema) 62%,rgba(253,252,249,0));
          padding:22px 0 18px;margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #ej-pie .btn{min-width:170px}
  #ej-pie #btn-siguiente{margin-left:auto}
  #ej-pie #btn-siguiente{display:none}
  #ej-pie.corregido #btn-siguiente{display:inline-flex}

  /* ---------- celebracion ---------- */
  .premio{position:fixed;inset:0;z-index:90;background:rgba(35,43,66,.55);backdrop-filter:blur(3px);
          display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .26s var(--ease)}
  .premio.visible{opacity:1}
  .premio-caja{background:var(--crema);border-radius:26px;padding:34px 30px 28px;max-width:380px;width:100%;
               text-align:center;box-shadow:0 30px 70px rgba(35,43,66,.4);transform:scale(.9) translateY(10px);
               transition:transform .34s var(--ease)}
  .premio.visible .premio-caja{transform:none}
  .premio-icono{display:block;font-size:64px;line-height:1.1;animation:brinca .7s var(--ease) .1s both}
  @keyframes brinca{0%{transform:scale(.3) rotate(-14deg);opacity:0}60%{transform:scale(1.15) rotate(5deg);opacity:1}100%{transform:none;opacity:1}}
  .premio-eti{color:var(--carmin);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:12px}
  .premio-caja h2{font-size:27px;margin:4px 0 6px}
  .premio-caja p.sub{color:var(--gris);font-size:15.5px;margin-bottom:22px}
  .premio-caja .btn{width:100%}

  @media(max-width:520px){
    body{font-size:16px}
    /* la tira de la racha necesita 7 casillas: en dos columnas no cabe */
    .tablero{grid-template-columns:1fr}
    .cifra span{font-size:12px}
    .frases>li{padding-left:16px;padding-top:34px}
    .frases>li::before{top:10px}
    .hueco.corto{width:5.5em}
    .hueco.medio{width:8em}
    .hueco.largo{width:100%;display:block;margin:4px 0}
    .sol{display:block;margin:6px 0 0}
    .continuar{flex-direction:column;align-items:stretch}
    .continuar .btn{width:100%}
    #ej-pie{flex-direction:column}
    #ej-pie .btn{width:100%}
    #ej-pie #btn-siguiente{order:-1}
    .stat b{font-size:26px}
  }
  /* el panel se abre a dos columnas: el camino a la izquierda, las cifras a la
     derecha. Por debajo de 900 px, una sola columna con las cifras arriba. */
  @media(min-width:900px){
    #s-panel{max-width:1160px;padding-left:32px;padding-right:32px}
    .panel-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0 40px;align-items:start}
    #continuar{grid-column:1;grid-row:1}
    .col-principal{grid-column:1;grid-row:2;min-width:0}
    .col-lateral{grid-column:2;grid-row:1/span 2;position:sticky;top:96px}
  }
  /* en pantalla estrecha el orden es el del DOM: seguir, cifras, camino */
  @media(max-width:899px){
    .col-lateral{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin-bottom:26px}
    .col-lateral .tarjeta-p{margin-bottom:0}
    .insignias-mini{grid-column:1/-1}
  }
  @media(max-width:620px){.col-lateral{grid-template-columns:1fr}}
  @media(max-width:520px){
    .paso::before{left:19px}
    .nodo{width:38px;height:38px;font-size:16px}
    .paso.completa .nodo{font-size:18px}
    .paso-btn{grid-template-columns:38px minmax(0,1fr) auto;gap:0 12px;padding-right:2px}
    .paso-cuerpo{padding-top:3px}
    .paso-tit{font-size:17.5px}
    .paso-marca{padding:4px 10px;font-size:12.5px}
    .paso-marca.hecho,.paso-marca.pronto{font-size:11px;padding:4px 9px}
    .paso.pronto .nodo{margin-left:1px}
    .tramo-cab{padding:13px 14px;gap:10px}
    .tramo-cuenta{display:none}
    .tramo-cuerpo{padding:2px 12px 12px}
  }

  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="main" id="cabecera">
  <div class="nav-inner">
    <a class="logo" href="/index.html" aria-label="Academia Well">
      <svg class="mark" viewBox="0 0 100 140" aria-hidden="true"><defs><clipPath id="mclipH"><rect x="2" y="2" width="96" height="136" rx="5"/></clipPath></defs><g clip-path="url(#mclipH)"><rect x="2" y="2" width="96" height="136" fill="#C0293B"/><path d="M-10 84 C16 62 26 68 34 98 C40 121 46 121 52 86 C58 51 64 51 70 84 C76 117 84 117 92 54 C96 31 101 22 112 10 L112 -10 L-12 -10 Z" fill="#21409A"/><path class="ribbon" d="M-10 84 C16 62 26 68 34 98 C40 121 46 121 52 86 C58 51 64 51 70 84 C76 117 84 117 92 54 C96 31 101 22 112 10" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/></g></svg>
      <span class="logo-text">Academia <br>Well</span>
    </a>

    <button class="volver" id="btn-volver" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="volver-txt">Tu camino</span>
    </button>

    <span class="producto">Well Online</span>
    <span class="t-titulo" id="t-titulo"></span>

        <button type="button" disabled>Ajustes <em>pronto</em></button>
        <button type="button" disabled>Mis informes <em>pronto</em></button>
        <div class="um-sep"></div>
        <a href="/index.html">Volver a la web</a>
      </div>
    </div>
  </div>
</header>

<main>

  <!-- ============ panel ============ -->
  <section class="pantalla" id="s-panel">

    <div class="hola">
      <div>
        <span class="kicker">Well Online · prototipo</span>
        <h1 id="saludo">Hola</h1>
        <p class="situacion"><span id="nivel-alumno" hidden></span><span id="situacion"></span></p>
      </div>
    </div>

    <div class="nombre-fila" id="pide-nombre" hidden>
      <input id="nombre-campo" type="text" maxlength="30" placeholder="¿Cómo te llamas?"
             autocomplete="given-name" aria-label="Tu nombre">
      <button class="btn btn-azul" id="nombre-ok" type="button">Guardar</button>
    </div>

    <p id="sin-test" hidden>Aún no sabemos tu nivel. <a href="/test.html">Haz el test, son 15 minutos →</a></p>

    <div class="panel-grid">

      <div class="continuar" id="continuar" hidden></div>

      <aside class="col-lateral">

        <div class="tarjeta-p progreso">
          <div class="aro-caja">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="aro-pista" cx="60" cy="60" r="52"></circle>
              <circle class="aro-avance" id="aro" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"></circle>
            </svg>
            <div class="aro-centro"><b id="aro-pct">0%</b><span id="aro-pie">dominado</span></div>
          </div>
          <p id="aro-detalle"></p>
          <div class="cifras">
            <div class="cifra"><b id="cf-perfectos">0</b><span>perfectos</span></div>
            <div class="cifra"><b id="cf-etapas">0</b><span>etapas</span></div>
            <div class="cifra"><b id="cf-pendientes">0</b><span>te quedan</span></div>
          </div>
        </div>

        <div class="tarjeta-p racha">
          <p class="racha-num"><b id="racha-n">0</b><span id="racha-pie">días seguidos</span></p>
          <div id="tira"></div>
        </div>

        <div class="tarjeta-p insignias-mini">
          <div class="im-cab">
            <h2>Insignias</h2>
            <span id="ins-cuenta"></span>
          </div>
          <div id="ins-tira"></div>
          <div id="hito" hidden></div>
          <button class="ver-todas" id="ver-insignias" type="button">Ver todas</button>
        </div>

      </aside>

      <div class="col-principal">
        <div id="rutas"></div>
      </div>

    </div>
  </section>

  <!-- ============ etapa ============ -->
  <section class="pantalla" id="s-etapa">
    <div class="et-cab">
      <p class="miga" id="et-ruta"></p>
      <h1 id="et-titulo"></h1>
      <div id="et-temas" hidden></div>
      <div class="et-progreso">
        <p id="et-dominio"></p>
        <div class="barra"><i id="et-fill"></i></div>
      </div>
    </div>
    <ul class="tarjetas" id="et-lista"></ul>
  </section>

  <!-- ============ ejercicio ============ -->
  <section class="pantalla" id="s-ejercicio">
    <div class="ej-cab">
      <p class="miga" id="ej-etapa"></p>
      <span class="kicker" id="ej-tipo"></span>
      <h1 id="ej-titulo"></h1>
      <p class="instruccion" id="ej-instruccion"></p>
    </div>
    <div id="ej-caja" hidden></div>
    <div id="ej-cuerpo"></div>
    <div class="resultado" id="ej-resultado" hidden></div>
    <div id="ej-pie">
      <button class="btn btn-azul" id="btn-corregir" type="button">Corregir</button>
      <button class="btn btn-ghost" id="btn-repetir" type="button" hidden>Repetir fallos</button>
      <button class="btn btn-azul" id="btn-siguiente" type="button">Siguiente</button>
    </div>
  </section>

</main>

<div class="hoja" id="hoja-insignias" role="dialog" aria-modal="true" aria-labelledby="hoja-tit" hidden>
  <div class="hoja-caja">
    <div class="hoja-cab">
      <h2 id="hoja-tit">Insignias</h2>
      <button class="hoja-x" id="cierra-insignias" type="button" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3"
             stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="insignias"></div>
  </div>
</div>

<div class="premio" id="premio" role="dialog" aria-modal="true" aria-labelledby="premio-tit" hidden>

    <p class="premio-eti" id="premio-eti"></p>
    <h2 id="premio-tit"></h2>
    <p class="sub" id="premio-sub"></p>
    <button class="btn btn-azul" id="premio-ok" type="button">Seguir</button>
  </div>
</div>

<script>
window.WELL_UI_P = {
  tipos: {
    caja: 'Preposiciones',
    cloze: 'Open cloze',
    formacion: 'Formación de palabras',
    transformacion: 'Transformaciones'
  },
  items: 'huecos',
  hueco: 'Hueco',
  perfecto: 'Perfecto',
  solucion: 'Solución:',
  pronto: 'Pronto',
  diasSemana: ['D', 'L', 'M', 'X', 'J', 'V', 'S'],
  saludo: {
    manana: 'Buenos días, {nombre}',
    tarde:  'Buenas tardes, {nombre}',
    noche:  'Buenas noches, {nombre}'
  },
  saludoSinNombre: 'Tu camino',
  vasPor: 'Vas por la {etapa} de {ruta}.',
  alDia: 'Estás al día con todo lo que hay cargado. Buen trabajo.',
  dominado: 'dominado',
  huecosDe: '{ok} de {n} huecos',
  diaSeguido: 'día seguido',
  diasSeguidos: 'días seguidos',
  proximoHito: 'Tu próxima insignia',
  insigniasDe: '{g} de {t}',
  estasAqui: 'estás aquí',
  tuPerfil: 'Tu perfil',
