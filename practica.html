<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu camino · Well Online (prototipo)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Prototipo de Well Online: panel del alumno con su nivel, su racha y el camino de ejercicios que se va abriendo segun avanza.">
<meta name="theme-color" content="#21409A">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#21409A; --tinta:#232B42; --carmin:#C0293B;
    --carmin-suave:#FBE9EB; --azul-suave:#E9EDF9; --neutro:#F2F1ED;
    --crema:#FDFCF9; --verde:#1E8E5A; --verde-suave:#EAF6F0; --gris:#5E6575;
    --linea:rgba(35,43,66,.12); --sombra:0 16px 44px rgba(35,43,66,.12); --radio:20px;
    --dur:.28s; --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--crema);color:var(--tinta);font-family:'Figtree',sans-serif;font-size:17px;line-height:1.6;min-height:100dvh;display:flex;flex-direction:column}
  h1,h2,h3{font-family:'Bree Serif',serif;font-weight:400;color:var(--azul);line-height:1.15}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--azul);outline-offset:3px;border-radius:4px}
  .btn{font-weight:600;font-size:16px;padding:14px 26px;border-radius:100px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;font-family:'Figtree',sans-serif;transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s;min-height:48px}
  .btn:active{transform:scale(.98)}
  .btn-azul{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(33,64,154,.24)}
  .btn-azul:hover{box-shadow:0 10px 22px rgba(33,64,154,.3);transform:translateY(-1px)}
  .btn-ghost{color:var(--azul);border:1.5px solid var(--azul);background:transparent}
  .btn-ghost:hover{background:var(--azul-suave)}

  /* ---------- cabecera ---------- */
  .t-head{position:sticky;top:0;z-index:50;background:rgba(253,252,249,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
  .t-inner{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--azul);flex:none}
  .logo svg.mark{height:38px;width:auto}
  .logo-text{font-family:'Bree Serif',serif;font-size:16px;line-height:1.05}
  .t-titulo{font-family:'Bree Serif',serif;color:var(--azul);font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-salir{background:none;border:1.5px solid var(--linea);border-radius:100px;padding:8px 15px 8px 12px;
           font-size:14px;font-weight:600;color:var(--gris);cursor:pointer;min-height:40px;flex:none;
           display:inline-flex;align-items:center;gap:5px;max-width:190px;
           transition:border-color .15s,color .15s}
  .t-salir:hover{border-color:var(--azul);color:var(--azul)}
  .t-salir span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-salir svg{flex:none}
  body:not(.dentro) #btn-volver{visibility:hidden}
  @media(max-width:480px){.logo-text{display:none}}

  /* ---------- pantallas ---------- */
  main{flex:1}
  .pantalla{max-width:760px;margin:0 auto;padding:26px 18px 110px;display:none}
  .pantalla.activa{display:block;animation:entra var(--dur) var(--ease)}
  @keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .kicker{display:inline-block;color:var(--carmin);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .miga{color:var(--gris);font-size:14px;margin-bottom:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .miga span{opacity:.5}
  .miga-atras{background:none;border:none;padding:0;color:var(--azul);font-size:14px;font-weight:600;
              cursor:pointer;text-decoration:underline;text-underline-offset:3px;
              text-decoration-color:rgba(33,64,154,.35);transition:text-decoration-color .15s}
  .miga-atras:hover{text-decoration-color:var(--azul)}

  /* ---------- panel ---------- */
  .hola{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:4px}
  .hola h1{font-size:clamp(27px,5.2vw,38px)}
  #nivel-alumno{flex:none;background:var(--azul);color:#fff;font-family:'Bree Serif',serif;font-size:19px;
                border-radius:100px;padding:5px 17px;line-height:1.35;margin-top:4px}
  #situacion{color:var(--gris);margin-bottom:6px}
  .nombre-fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 22px}
  .nombre-fila input{font:inherit;font-size:16px;border:1.5px solid var(--linea);border-radius:100px;
                     padding:10px 18px;background:#fff;color:var(--tinta);min-width:0;flex:1;max-width:260px}
  .nombre-fila input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(33,64,154,.14)}
  .nombre-fila button{background:var(--azul);color:#fff;border:none;border-radius:100px;padding:11px 20px;
                      font-weight:600;font-size:15px;cursor:pointer}
  #cambia-nombre{background:none;border:none;color:var(--gris);font-size:13.5px;text-decoration:underline;
                 cursor:pointer;padding:0;margin:0 0 20px}
  #cambia-nombre:hover{color:var(--azul)}

  .tablero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .tarjeta-p{background:#fff;border:1px solid var(--linea);border-radius:18px;padding:18px;text-align:center}
  .aro-caja{position:relative;width:132px;height:132px;margin:0 auto 8px}
  .aro-caja svg{width:100%;height:100%;transform:rotate(-90deg)}
  .aro-caja circle{fill:none;stroke-width:11;stroke-linecap:round}
  .aro-pista{stroke:var(--azul-suave)}
  .aro-avance{stroke:var(--azul);transition:stroke-dashoffset 1.1s var(--ease)}
  .aro-centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .aro-centro b{font-family:'Bree Serif',serif;font-size:31px;color:var(--azul);line-height:1;font-variant-numeric:tabular-nums}
  .aro-centro span{font-size:12px;font-weight:600;color:var(--gris);margin-top:2px}
  #aro-detalle{font-size:13.5px;color:var(--gris)}

  .racha-num{display:flex;align-items:baseline;justify-content:center;gap:7px;margin-bottom:2px}
  .racha-num b{font-family:'Bree Serif',serif;font-size:44px;color:var(--carmin);line-height:1;font-variant-numeric:tabular-nums}
  .racha-num span{font-size:13.5px;font-weight:600;color:var(--gris)}
  #tira{display:flex;gap:5px;justify-content:center;margin-top:16px}
  .dia{width:30px;height:38px;border-radius:10px;background:var(--neutro);display:flex;align-items:center;
       justify-content:center;font-size:12px;font-weight:700;color:var(--gris)}
  .dia i{font-style:normal}
  .dia.hecho{background:var(--carmin);color:#fff}
  .dia.hoy{box-shadow:0 0 0 2px var(--crema),0 0 0 4px var(--azul)}

  .cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
  .cifra{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:14px 10px;text-align:center}
  .cifra b{display:block;font-family:'Bree Serif',serif;font-size:27px;color:var(--azul);line-height:1.05;font-variant-numeric:tabular-nums}
  .cifra span{display:block;font-size:12.5px;font-weight:600;color:var(--gris);margin-top:3px;line-height:1.3}

  #hito{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:14px 17px;
        display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:24px}
  .hito-icono{font-size:26px;line-height:1}
  .hito-cuerpo{min-width:0}
  .hito-eti{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--carmin)}
  .hito-tit{display:block;font-family:'Bree Serif',serif;color:var(--azul);font-size:18px;line-height:1.2;margin-top:1px}
  .hito-barra{display:block;height:6px;background:var(--neutro);border-radius:100px;margin-top:7px;overflow:hidden}
  .hito-barra i{display:block;height:100%;background:var(--carmin);border-radius:100px;transition:width .7s var(--ease)}
  .hito-num{font-family:'Bree Serif',serif;font-size:20px;color:var(--azul);font-variant-numeric:tabular-nums;white-space:nowrap}
  .hito-num em{font-style:normal;font-size:14px;color:var(--gris)}

  #sin-test{background:var(--azul-suave);border-radius:14px;padding:13px 18px;font-size:15px;margin-bottom:20px;
            display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
  #sin-test a{color:var(--azul);font-weight:700}

  .continuar{background:var(--azul);color:#fff;border-radius:var(--radio);padding:20px 22px;margin-bottom:30px;
             display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
             box-shadow:0 14px 34px rgba(33,64,154,.24)}
  .cont-eti{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
  .cont-tit{font-family:'Bree Serif',serif;font-size:23px;line-height:1.2;margin:2px 0}
  .cont-sub{font-size:14.5px;opacity:.8}
  .continuar .btn-azul{background:#fff;color:var(--azul);box-shadow:none}
  .continuar .btn-azul:hover{background:#fff;box-shadow:0 8px 18px rgba(0,0,0,.18)}

  .ruta{margin-bottom:34px}
  .ruta-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
  .ruta-cab h2{font-size:24px}
  .ruta-sub{color:var(--gris);font-size:15px;margin-top:2px}
  .nivel-chip{flex:none;background:var(--azul-suave);color:var(--azul);font-size:13px;font-weight:700;
              border-radius:100px;padding:5px 13px;letter-spacing:.03em}
  .etapas{list-style:none;display:grid;gap:9px}
  .etapas li.oculta{display:none}
  .etapa{width:100%;text-align:left;font-family:'Figtree',sans-serif;color:inherit;
         background:#fff;border:1px solid var(--linea);border-radius:14px;padding:13px 15px;display:grid;
         grid-template-columns:34px 1fr auto;gap:13px;align-items:center;cursor:pointer;
         transition:border-color .15s,box-shadow .15s,transform .15s}
  .etapa.abierta:hover,.etapa.completa:hover{border-color:var(--azul);box-shadow:0 8px 20px rgba(35,43,66,.09);transform:translateY(-1px)}
  .etapa.aqui{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-suave)}
  .et-aqui{display:inline-block;font-style:normal;background:var(--azul);color:#fff;font-family:'Figtree',sans-serif;
           font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:100px;
           padding:3px 9px;margin-left:8px;vertical-align:middle}
  .et-num{width:34px;height:34px;border-radius:50%;background:var(--azul-suave);color:var(--azul);font-weight:700;
          font-size:14.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .et-cuerpo{min-width:0}
  .et-tit{display:block;font-family:'Bree Serif',serif;color:var(--azul);font-size:18px;line-height:1.25}
  .et-sub{display:block;color:var(--gris);font-size:13.5px;line-height:1.45;margin-top:2px;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
  .et-barra{display:block;height:5px;background:var(--neutro);border-radius:100px;margin-top:8px;overflow:hidden}
  .et-barra i{display:block;height:100%;background:var(--azul);border-radius:100px;transition:width .5s var(--ease)}
  .et-marca{flex:none;font-size:14px;font-weight:700;color:var(--azul);font-variant-numeric:tabular-nums}
  .et-marca.abierta{background:var(--azul-suave);border-radius:100px;padding:5px 12px}
  .et-marca.ok{width:32px;height:32px;border-radius:50%;background:var(--verde-suave);color:var(--verde);
               display:flex;align-items:center;justify-content:center;font-size:16px}
  .et-marca.pronto{background:var(--neutro);color:var(--gris);border-radius:100px;padding:5px 12px;font-size:12.5px;
                   letter-spacing:.04em;text-transform:uppercase}
  .etapa.completa{border-color:rgba(30,142,90,.4)}
  .etapa.completa .et-num{background:var(--verde-suave);color:var(--verde)}
  .etapa:disabled{cursor:default;background:transparent;border-style:dashed;transform:none;box-shadow:none}
  .etapa.bloqueada .et-tit,.etapa.pronto .et-tit{color:var(--gris)}
  .etapa.bloqueada .et-num,.etapa.pronto .et-num{background:var(--neutro);color:var(--gris)}
  .etapa.bloqueada .et-marca{color:var(--gris);display:flex;align-items:center}
  .etapa.bloqueada .et-sub{color:var(--carmin);white-space:normal}
  .ver-mas{margin-top:11px;background:none;border:1.5px solid var(--linea);border-radius:100px;padding:9px 18px;
           font-size:14.5px;font-weight:600;color:var(--azul);cursor:pointer;transition:border-color .15s}
  .ver-mas:hover{border-color:var(--azul)}
  .ruta-pie{color:var(--gris);font-size:13.5px;margin-top:11px}

  .insignias-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
  .insignias-cab h2{font-size:22px}
  #ins-cuenta{font-size:14px;font-weight:600;color:var(--gris)}
  #insignias{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;grid-auto-rows:1fr}
  .insignia{position:relative;background:transparent;border:1px dashed var(--linea);border-radius:16px;
            padding:16px 13px 14px;text-align:center}
  .ins-icono{display:block;font-size:30px;line-height:1.2;filter:grayscale(1);opacity:.3}
  .ins-tit{display:block;font-weight:700;font-size:14.5px;margin-top:5px;color:var(--gris)}
  .ins-sub{display:block;color:var(--gris);font-size:12.5px;line-height:1.4;margin-top:2px}
  .ins-barra{display:block;height:5px;background:var(--neutro);border-radius:100px;margin-top:10px;overflow:hidden}
  .ins-barra i{display:block;height:100%;background:var(--azul);border-radius:100px}
  .ins-num{display:block;font-size:12px;font-weight:700;color:var(--gris);margin-top:4px;font-variant-numeric:tabular-nums}
  .insignia.lograda{background:#fff;border-style:solid;border-color:rgba(30,142,90,.35);box-shadow:0 6px 16px rgba(35,43,66,.07)}
  .insignia.lograda .ins-icono{filter:none;opacity:1}
  .insignia.lograda .ins-tit{color:var(--tinta)}
  .ins-check{position:absolute;top:9px;right:9px;width:21px;height:21px;border-radius:50%;background:var(--verde);
             color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* ---------- etapa ---------- */
  .et-cab h1{font-size:clamp(25px,4.6vw,33px);margin-bottom:10px}
  #et-temas{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  #et-temas span{background:var(--neutro);border-radius:100px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--gris)}
  .et-progreso{margin-bottom:22px}
  .et-progreso p{font-size:14px;color:var(--gris);margin-bottom:6px}
  .barra{height:8px;background:var(--azul-suave);border-radius:100px;overflow:hidden}
  .barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--azul),#3A5BC7);border-radius:100px;transition:width .55s var(--ease)}
  .tarjetas{list-style:none;display:grid;gap:10px}
  .tarjeta{width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:15px 17px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;transition:border-color .15s,box-shadow .15s,transform .15s}
  .tarjeta:hover{border-color:var(--azul);box-shadow:0 8px 20px rgba(35,43,66,.09);transform:translateY(-1px)}
  .t-tipo{grid-column:1;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gris)}
  .t-tit{grid-column:1;font-family:'Bree Serif',serif;color:var(--azul);font-size:19px}
  .pill{grid-column:2;grid-row:1/3;font-size:14px;font-weight:700;color:var(--azul);background:var(--azul-suave);border-radius:100px;padding:6px 13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pill.vacia{color:var(--gris);background:var(--neutro);font-weight:600}
  .pill.ok{color:var(--verde);background:var(--verde-suave)}
  .tarjeta.perfecto{border-color:rgba(30,142,90,.4)}

  /* ---------- ejercicio ---------- */
  .ej-cab h1{font-size:clamp(25px,4.6vw,33px);margin-bottom:8px}
  .ej-cab .instruccion{color:var(--gris);margin-bottom:20px}
  .ej-cab .instruccion b{color:var(--tinta);font-weight:600}
  #ej-caja{display:flex;flex-wrap:wrap;gap:8px;background:#fff;border:1px dashed var(--linea);border-radius:14px;padding:14px;margin-bottom:22px}
  #ej-caja span{background:var(--neutro);border-radius:100px;padding:5px 13px;font-size:15px;font-weight:600}

  .frases{list-style:none;counter-reset:f;display:grid;gap:14px}
  .frases>li{counter-increment:f;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px 16px 14px 46px;position:relative}
  .frases>li::before{content:counter(f);position:absolute;left:14px;top:14px;font-weight:700;font-size:14px;color:var(--gris);font-variant-numeric:tabular-nums}
  .frase{line-height:2.1}
  .origen{color:var(--tinta);margin-bottom:6px}
  .clave{margin-bottom:6px}
  .clave span{display:inline-block;background:var(--azul-suave);color:var(--azul);border-radius:7px;padding:2px 11px;font-size:13.5px;font-weight:700;letter-spacing:.06em}
  .raiz{display:inline-block;background:var(--neutro);border-radius:7px;padding:2px 10px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--gris)}
  .texto{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:18px 20px}
  .texto p{line-height:2.35;margin-bottom:14px}
  .texto p:last-child{margin-bottom:0}
  .conhueco{white-space:nowrap}
  .num{position:relative;top:-.55em;font-size:11.5px;font-weight:700;color:var(--carmin);font-style:normal;margin-right:1px}

  /* el hueco fija su propia altura de linea: si hereda la del parrafo (2.1 o
     2.35) la caja crece hasta ocupar toda la linea y las de dos lineas
     seguidas se pisan */
  .hueco{font:inherit;line-height:1.35;font-weight:600;color:var(--azul);background:var(--neutro);
         border:1px solid var(--linea);border-bottom:2px solid var(--azul);border-radius:7px 7px 3px 3px;
         padding:2px 8px;max-width:100%;vertical-align:baseline;transition:background .15s,border-color .15s}
  .hueco.corto{width:6.5em}
  .hueco.medio{width:9.5em}
  .hueco.largo{width:14em}
  .hueco:focus{outline:none;background:#fff;border-color:var(--azul);box-shadow:0 0 0 3px rgba(33,64,154,.15)}
  .hueco.ok{color:var(--verde);border-bottom-color:var(--verde);background:var(--verde-suave)}
  .hueco.mal{color:var(--carmin);border-bottom-color:var(--carmin);background:var(--carmin-suave);text-decoration:line-through;text-decoration-thickness:1px}
  .sol{display:inline-block;margin-left:6px;font-size:15px;font-weight:600;color:var(--verde);white-space:normal}
  .sol em{font-style:normal;font-weight:500;color:var(--gris);font-size:13.5px}

  .resultado{margin:24px 0 0;border-radius:14px;padding:16px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;animation:entra var(--dur) var(--ease)}
  .resultado b{font-family:'Bree Serif',serif;font-size:27px;font-variant-numeric:tabular-nums}
  .resultado.genial{background:var(--verde-suave)}.resultado.genial b{color:var(--verde)}
  .resultado.bien{background:var(--azul-suave)}.resultado.bien b{color:var(--azul)}
  .resultado.flojo{background:var(--carmin-suave)}.resultado.flojo b{color:var(--carmin)}

  /* en escritorio los botones ocupan lo que miden, no toda la fila; el
     principal queda a la derecha, que es donde se busca para avanzar */
  #ej-pie{position:sticky;bottom:0;background:linear-gradient(to top,var(--crema) 62%,rgba(253,252,249,0));
          padding:22px 0 18px;margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #ej-pie .btn{min-width:170px}
  #ej-pie #btn-siguiente{margin-left:auto}
  #ej-pie #btn-siguiente{display:none}
  #ej-pie.corregido #btn-siguiente{display:inline-flex}

  /* ---------- celebracion ---------- */
  .premio{position:fixed;inset:0;z-index:90;background:rgba(35,43,66,.55);backdrop-filter:blur(3px);
          display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .26s var(--ease)}
  .premio.visible{opacity:1}
  .premio-caja{background:var(--crema);border-radius:26px;padding:34px 30px 28px;max-width:380px;width:100%;
               text-align:center;box-shadow:0 30px 70px rgba(35,43,66,.4);transform:scale(.9) translateY(10px);
               transition:transform .34s var(--ease)}
  .premio.visible .premio-caja{transform:none}
  .premio-icono{display:block;font-size:64px;line-height:1.1;animation:brinca .7s var(--ease) .1s both}
  @keyframes brinca{0%{transform:scale(.3) rotate(-14deg);opacity:0}60%{transform:scale(1.15) rotate(5deg);opacity:1}100%{transform:none;opacity:1}}
  .premio-eti{color:var(--carmin);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:12px}
  .premio-caja h2{font-size:27px;margin:4px 0 6px}
  .premio-caja p.sub{color:var(--gris);font-size:15.5px;margin-bottom:22px}
  .premio-caja .btn{width:100%}

  @media(max-width:520px){
    body{font-size:16px}
    /* la tira de la racha necesita 7 casillas: en dos columnas no cabe */
    .tablero{grid-template-columns:1fr}
    .cifra span{font-size:12px}
    .frases>li{padding-left:16px;padding-top:34px}
    .frases>li::before{top:10px}
    .hueco.corto{width:5.5em}
    .hueco.medio{width:8em}
    .hueco.largo{width:100%;display:block;margin:4px 0}
    .sol{display:block;margin:6px 0 0}
    .continuar{flex-direction:column;align-items:stretch}
    .continuar .btn{width:100%}
    #ej-pie{flex-direction:column}
    #ej-pie .btn{width:100%}
    #ej-pie #btn-siguiente{order:-1}
    .stat b{font-size:26px}
  }
  /* en escritorio el panel se abre a dos columnas: el camino a la izquierda y
     las insignias siempre a la vista a la derecha */
  @media(min-width:920px){
    #s-panel{max-width:1080px}
    .panel-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:38px;align-items:start}
    .col-lateral{position:sticky;top:84px}
    #insignias{grid-template-columns:repeat(2,1fr)}
    .insignias{margin-top:0}
  }
  @media(min-width:920px) and (max-width:1120px){
    .panel-grid{grid-template-columns:minmax(0,1fr) 290px;gap:28px}
  }

  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

        <path d="M8 12 C22 98 36 98 48 54 C55 27 65 27 72 54 C84 98 98 98 112 12"
              fill="none" stroke="#21409A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

    </a>
    <span class="t-titulo" id="t-titulo">Well Online</span>

      <span id="volver-txt">Tu camino</span>
    </button>
  </div>
</header>

<main>

  <!-- ============ panel ============ -->
  <section class="pantalla" id="s-panel">

    <div class="hola">
      <div>
        <span class="kicker">Well Online · prototipo</span>
        <h1 id="saludo">Hola</h1>
      </div>
      <span id="nivel-alumno" hidden></span>
    </div>
    <p id="situacion"></p>

    <div class="nombre-fila" id="pide-nombre" hidden>
      <input id="nombre-campo" type="text" maxlength="30" placeholder="¿Cómo te llamas?"
             autocomplete="given-name" aria-label="Tu nombre">
      <button id="nombre-ok" type="button">Guardar</button>
    </div>
    <button id="cambia-nombre" type="button" hidden>cambiar nombre</button>

    <p id="sin-test" hidden>Aún no sabemos tu nivel. <a href="/test.html">Haz el test, son 15 minutos →</a></p>

    <div class="panel-grid">
    <div class="col-principal">

    <div class="tablero">
      <div class="tarjeta-p">
        <div class="aro-caja">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="aro-pista" cx="60" cy="60" r="52"></circle>
            <circle class="aro-avance" id="aro" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"></circle>
          </svg>
          <div class="aro-centro"><b id="aro-pct">0%</b><span id="aro-pie">dominado</span></div>
        </div>
        <p id="aro-detalle"></p>
      </div>
      <div class="tarjeta-p">
        <p class="racha-num"><b id="racha-n">0</b><span id="racha-pie">días seguidos</span></p>
        <div id="tira"></div>
      </div>
    </div>

    <div class="cifras">
      <div class="cifra"><b id="cf-perfectos">0</b><span>ejercicios<br>perfectos</span></div>
      <div class="cifra"><b id="cf-etapas">0</b><span>etapas<br>completas</span></div>
      <div class="cifra"><b id="cf-pendientes">0</b><span>te quedan<br>ahora mismo</span></div>
    </div>

    <div id="hito" hidden></div>

    <div class="continuar" id="continuar" hidden></div>

    <div id="rutas"></div>

    </div><!-- /col-principal -->

    <aside class="col-lateral">
      <section class="insignias">
        <div class="insignias-cab">
          <h2>Insignias</h2>
          <span id="ins-cuenta"></span>
        </div>
        <div id="insignias"></div>
      </section>
    </aside>

    </div><!-- /panel-grid -->
  </section>

  <!-- ============ etapa ============ -->
  <section class="pantalla" id="s-etapa">
    <div class="et-cab">
      <p class="miga" id="et-ruta"></p>
      <h1 id="et-titulo"></h1>
      <div id="et-temas" hidden></div>
      <div class="et-progreso">
        <p id="et-dominio"></p>
        <div class="barra"><i id="et-fill"></i></div>
      </div>
    </div>
    <ul class="tarjetas" id="et-lista"></ul>
  </section>

  <!-- ============ ejercicio ============ -->
  <section class="pantalla" id="s-ejercicio">
    <div class="ej-cab">
      <p class="miga" id="ej-etapa"></p>
      <span class="kicker" id="ej-tipo"></span>
      <h1 id="ej-titulo"></h1>
      <p class="instruccion" id="ej-instruccion"></p>
    </div>
    <div id="ej-caja" hidden></div>
    <div id="ej-cuerpo"></div>
    <div class="resultado" id="ej-resultado" hidden></div>
    <div id="ej-pie">
      <button class="btn btn-azul" id="btn-corregir" type="button">Corregir</button>
      <button class="btn btn-ghost" id="btn-repetir" type="button" hidden>Repetir fallos</button>
      <button class="btn btn-azul" id="btn-siguiente" type="button">Siguiente</button>
    </div>
  </section>

</main>

<div class="premio" id="premio" role="dialog" aria-modal="true" aria-labelledby="premio-tit" hidden>
  <div class="premio-caja">
    <span class="premio-icono" id="premio-icono">🏆</span>
    <p class="premio-eti" id="premio-eti"></p>
    <h2 id="premio-tit"></h2>
    <p class="sub" id="premio-sub"></p>
    <button class="btn btn-azul" id="premio-ok" type="button">Seguir</button>
  </div>
</div>
